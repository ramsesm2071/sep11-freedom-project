<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Cyber-Survive: Pure Code Edition</title>
    <script src="//cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js"></script>
    <style type="text/css">
        body { margin: 0; background-color: #000; overflow: hidden; cursor: crosshair; }
    </style>
</head>
<body>

<script type="text/javascript">

var config = {
    type: Phaser.AUTO,
    width: 1000,
    height: 800,
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 0 },
            debug: false
        }
    },
    scene: { preload: preload, create: create, update: update }
};

var player;
var enemies;
var bullets;
var xpGems;
var keys;

var score = 0;
var level = 1;
var xp = 0;
var xpNeeded = 100;
var gameOver = false;

var uiText;
var lastFired = 0;
var fireRate = 250;
var currentScene;

var game = new Phaser.Game(config);

function preload () {
    // Left completely blank! We bypass the image asset loader to avoid all CORS blocks.
}

function create () {
    currentScene = this;

    // 🎨 CUSTOM ART ENGINE (Generates vector sprite textures directly in RAM)
    // 1. Draw Player (Top-down circles forming a helmet and weapon barrel)
    let pGraphics = this.make.graphics({ x: 0, y: 0, add: false });
    pGraphics.fillStyle(0x00aaff, 1); // Cyber blue body armor
    pGraphics.fillCircle(16, 16, 14);
    pGraphics.fillStyle(0xffffff, 1); // Visor/helmet glow
    pGraphics.fillCircle(16, 8, 4);
    pGraphics.fillStyle(0x555555, 1); // Laser gun barrel pointing UP
    pGraphics.fillRect(13, -4, 6, 12);
    pGraphics.generateTexture('playerAsset', 32, 32);

    // 2. Draw Zombie (Rotated top-down body with creepy outstretched reaching hands)
    let zGraphics = this.make.graphics({ x: 0, y: 0, add: false });
    zGraphics.fillStyle(0x22ff55, 1); // Infected rotting green flesh
    zGraphics.fillCircle(16, 16, 12);
    zGraphics.fillStyle(0xff3333, 1); // Raging red glowing eyes
    zGraphics.fillCircle(11, 10, 2);
    zGraphics.fillCircle(21, 10, 2);
    zGraphics.fillStyle(0x11aa33, 1); // Reaching arm 1
    zGraphics.fillRect(6, -2, 4, 12);
    zGraphics.fillStyle(0x11aa33, 1); // Reaching arm 2
    zGraphics.fillRect(22, -2, 4, 12);
    zGraphics.generateTexture('zombieAsset', 32, 32);

    // 3. Draw Laser Projectile (Glowing neon sphere)
    let bGraphics = this.make.graphics({ x: 0, y: 0, add: false });
    bGraphics.fillStyle(0xffff00, 1);
    bGraphics.fillCircle(4, 4, 4);
    bGraphics.generateTexture('bulletAsset', 8, 8);

    // 4. Draw XP Shard (Bright emerald diamond crystal)
    let gGraphics = this.make.graphics({ x: 0, y: 0, add: false });
    gGraphics.fillStyle(0x00ffaa, 1);
    gGraphics.fillRect(2, 2, 8, 8);
    gGraphics.generateTexture('gemTexture', 12, 12);

    // Grid Arena Floor layout
    var graphics = this.add.graphics();
    graphics.lineStyle(1, 0x112233, 1);
    for (var x = 0; x < 1000; x += 40) {
        graphics.moveTo(x, 0);
        graphics.lineTo(x, 800);
    }
    for (var y = 0; y < 800; y += 40) {
        graphics.moveTo(0, y);
        graphics.lineTo(1000, y);
    }
    graphics.strokePath();

    // Spawn Player via custom texture asset
    player = this.physics.add.sprite(500, 400, 'playerAsset');
    player.setOrigin(0.5, 0.5);
    player.setCollideWorldBounds(true);

    // Groups Initialization
    bullets = this.physics.add.group();
    enemies = this.physics.add.group();
    xpGems = this.physics.add.group();

    // Map Keyboard tracking matrix
    keys = this.input.keyboard.addKeys({
        up: Phaser.Input.Keyboard.KeyCodes.W,
        down: Phaser.Input.Keyboard.KeyCodes.S,
        left: Phaser.Input.Keyboard.KeyCodes.A,
        right: Phaser.Input.Keyboard.KeyCodes.D,
        upArrow: Phaser.Input.Keyboard.KeyCodes.UP,
        downArrow: Phaser.Input.Keyboard.KeyCodes.DOWN,
        leftArrow: Phaser.Input.Keyboard.KeyCodes.LEFT,
        rightArrow: Phaser.Input.Keyboard.KeyCodes.RIGHT
    });

    // Score and XP UI readouts
    uiText = this.add.text(20, 20, 'Score: 0 | Lv: 1 | XP: 0%', { fontSize: '24px', fill: '#00ffcc', fontStyle: 'bold' });

    // Spawner Loop
    this.time.addEvent({ delay: 1200, callback: spawnZombie, callbackScope: this, loop: true });

    // System Colliders
    this.physics.add.collider(enemies, enemies);
    this.physics.add.overlap(bullets, enemies, hitZombie, null, this);
    this.physics.add.overlap(player, xpGems, collectGem, null, this);
    this.physics.add.collider(player, enemies, playerHit, null, this);
}

function update (time) {
    if (gameOver) {
        if (this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE).isDown) {
            location.reload();
        }
        return;
    }

    // Precise Cursor Tracking Look Math
    var pointer = this.input.activePointer;
    var angle = Phaser.Math.Angle.Between(player.x, player.y, pointer.x, pointer.y);

    // Custom drawn texture geometry points up at 0 rads, so we offset look by 90-deg (+Math.PI/2)
    player.setRotation(angle + Math.PI / 2);

    // Velocity Control Matrices
    player.setVelocity(0);
    var speed = 240;

    if (keys.left.isDown || keys.leftArrow.isDown) { player.setVelocityX(-speed); }
    else if (keys.right.isDown || keys.rightArrow.isDown) { player.setVelocityX(speed); }

    if (keys.up.isDown || keys.upArrow.isDown) { player.setVelocityY(-speed); }
    else if (keys.down.isDown || keys.downArrow.isDown) { player.setVelocityY(speed); }

    // Click Shoot execution check
    if (pointer.isDown && time > lastFired) {
        fireBullet(angle);
        lastFired = time + fireRate;
    }

    // Zombie Horde AI tracking loop
    enemies.children.iterate(function (zombie) {
        if (zombie) {
            currentScene.physics.moveToObject(zombie, player, 110 + (level * 6));
            zombie.setRotation(Phaser.Math.Angle.Between(zombie.x, zombie.y, player.x, player.y) + Math.PI / 2);
        }
    }, this);

    // Shard Magnet pull loop
    xpGems.children.iterate(function (gem) {
        if (gem) {
            var distance = Phaser.Math.Distance.Between(player.x, player.y, gem.x, gem.y);
            if (distance < 160) {
                currentScene.physics.moveToObject(gem, player, 380);
            } else {
                gem.body.setVelocity(0, 0);
            }
        }
    }, this);
}

function fireBullet (angle) {
    var bullet = bullets.create(player.x, player.y, 'bulletAsset');
    var bulletSpeed = 700;
    bullet.setVelocity(Math.cos(angle) * bulletSpeed, Math.sin(angle) * bulletSpeed);
    currentScene.time.delayedCall(1500, function() { bullet.destroy(); });
}

function spawnZombie () {
    if (gameOver) return;

    var angle = Phaser.Math.FloatBetween(0, Math.PI * 2);
    var x = player.x + Math.cos(angle) * 750;
    var y = player.y + Math.sin(angle) * 750;

    // Build Zombie using local canvas system safe-texture asset
    var zombie = enemies.create(x, y, 'zombieAsset');
    zombie.setOrigin(0.5, 0.5);
}

function hitZombie (bullet, zombie) {
    bullet.destroy();
    var gem = xpGems.create(zombie.x, zombie.y, 'gemTexture');
    zombie.destroy();
    score += 15;
    updateUI();
}

function collectGem (player, gem) {
    gem.destroy();
    xp += 25;

    if (xp >= xpNeeded) {
        level++;
        xp = 0;
        xpNeeded = Math.floor(xpNeeded * 1.35);

        fireRate = Math.max(70, fireRate - 30);
        player.setTint(0xffff00); // Gold level-up alert glow
        currentScene.time.delayedCall(300, () => { player.clearTint(); });
    }
    updateUI();
}

function playerHit (player, enemy) {
    currentScene.physics.pause();
    player.setTint(0xff0000);
    gameOver = true;

    // Add a dark red translucent overlay screen tint
    let gameOverOverlay = currentScene.add.graphics();
    gameOverOverlay.fillStyle(0x550000, 0.6);
    gameOverOverlay.fillRect(0, 0, 1000, 800);

    currentScene.add.text(500, 380, 'YOU WERE EATEN', { fontSize: '64px', fill: '#ff1133', fontStyle: 'bold' }).setOrigin(0.5);
    currentScene.add.text(500, 460, 'Press SPACE to retry', { fontSize: '24px', fill: '#ffffff' }).setOrigin(0.5);
}

function updateUI() {
    var pct = Math.floor((xp / xpNeeded) * 100);
    if (pct > 100) pct = 100;
    uiText.setText('Score: ' + score + ' | Lv: ' + level + ' | XP: ' + pct + '%');
}

</script>

</body>
</html>
