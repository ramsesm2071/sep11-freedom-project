<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Space Platformer Plus</title>
    <script src="//cdn.jsdelivr.net/npm/phaser@3.11.0/dist/phaser.js"></script>
    <style type="text/css">
        body { margin: 0; background-color: #000; }
    </style>
</head>
<body>

<script type="text/javascript">

var config = {
    type: Phaser.AUTO,
    width: 900,
    height: 800,
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 350 }, // Slightly higher gravity for snappier jumps
            debug: false
        }
    },
    scene: { preload: preload, create: create, update: update }
};

var player;
var stars;
var spikes;
var platforms;
var cursors;
var score = 0;
var gameOver = false;
var scoreText;
var canDoubleJump = false; // Track double jump state
var jumpKeyReleased = true; // Track jump key taps

var game = new Phaser.Game(config);

function preload () {
    this.load.image('space', 'tool/assets/space.png');
    this.load.image('ground', 'tool/assets/platform.png');
    this.load.image('star', 'tool/assets/star.png');
    this.load.image('asteroid', 'tool/assets/asteroid.png');
    this.load.spritesheet('dude', 'tool/assets/dude.png', { frameWidth: 32, frameHeight: 48 });
}

function create () {
    // Background
    var bg = this.add.image(450, 400, 'space');
    bg.setDisplaySize(900, 800);

    // Platforms
    platforms = this.physics.add.staticGroup();
    platforms.create(450, 790, 'ground').setScale(4).refreshBody();

    // Adjusted ledge positions to stay inside the 900px width limit
    platforms.create(650, 600, 'ground');
    platforms.create(450, 300, 'ground');
    platforms.create(200, 450, 'ground');
    platforms.create(750, 450, 'ground');
    platforms.create(750, 150, 'ground');
    platforms.create(150, 150, 'ground');

    // Player Setup
    player = this.physics.add.sprite(100, 450, 'dude');
    player.setBounce(0.1);
    player.setCollideWorldBounds(true);

    // Animations
    this.anims.create({
        key: 'left',
        frames: this.anims.generateFrameNumbers('dude', { start: 0, end: 3 }),
        frameRate: 12,
        repeat: -1
    });
    this.anims.create({
        key: 'turn',
        frames: [ { key: 'dude', frame: 4 } ],
        frameRate: 20
    });
    this.anims.create({
        key: 'right',
        frames: this.anims.generateFrameNumbers('dude', { start: 5, end: 8 }),
        frameRate: 12,
        repeat: -1
    });

    cursors = this.input.keyboard.createCursorKeys();

    // Stars Setup
    stars = this.physics.add.group();
    for (var i = 0; i < 12; i++) {
        var x = Phaser.Math.Between(50, 850);
        var y = Phaser.Math.Between(50, 500);
        stars.create(x, y, 'star');
    }

    stars.children.iterate(function (child) {
        child.setBounceY(Phaser.Math.FloatBetween(0.4, 0.8));
    });

    spikes = this.physics.add.group();

    // UI
    scoreText = this.add.text(16, 16, 'Score: 0', { fontSize: '32px', fill: '#fff', fontStyle: 'bold' });

    // Colliders
    this.physics.add.collider(player, platforms);
    this.physics.add.collider(stars, platforms);
    this.physics.add.collider(spikes, platforms);

    this.physics.add.overlap(player, stars, collectStar, null, this);
    this.physics.add.collider(player, spikes, hitAsteroid, null, this);
}

function update () {
    if (gameOver && cursors.space.isDown) {
        location.reload();
    }

    if (gameOver) { return; }

    // Left/Right Movement
    if (cursors.left.isDown) {
        player.setVelocityX(-240);
        player.anims.play('left', true);
    } else if (cursors.right.isDown) {
        player.setVelocityX(240);
        player.anims.play('right', true);
    } else {
        player.setVelocityX(0);
        player.anims.play('turn');
    }

    // Screen Wrap Feature (Step off left, appear on right)
    if (player.x < 15) {
        player.x = 885;
    } else if (player.x > 885) {
        player.x = 15;
    }

    // Reset Jump States on Ground
    if (player.body.touching.down) {
        canDoubleJump = true;
    }

    // Jump Input Tracking (Prevents holding key down for automatic double jump)
    if (cursors.up.isUp) {
        jumpKeyReleased = true;
    }

    // Jumping Mechanics
    if (cursors.up.isDown && jumpKeyReleased) {
        if (player.body.touching.down) {
            player.setVelocityY(-380);
            jumpKeyReleased = false;
        } else if (canDoubleJump) {
            player.setVelocityY(-340); // Double jump slightly weaker
            canDoubleJump = false;
            jumpKeyReleased = false;

            // Visual feedback for double jump
            player.setTint(0x00ff00);
            this.time.delayedCall(150, () => { player.clearTint(); });
        }
    }
}

function collectStar (player, star) {
    star.disableBody(true, true);
    score += 10;
    scoreText.setText('Score: ' + score);

    if (stars.countActive(true) === 0) {
        stars.children.iterate(function (child) {
            child.enableBody(true, Phaser.Math.Between(50, 850), Phaser.Math.Between(50, 300), true, true);
        });

        // Spawn smarter, randomized asteroids
        var x = (player.x < 450) ? Phaser.Math.Between(450, 850) : Phaser.Math.Between(50, 450);
        var asteroid = spikes.create(x, 16, 'asteroid');

        asteroid.setBounce(1);
        asteroid.setCollideWorldBounds(true);

        // Randomize speed scaling with total score
        var speedModifier = 1 + (score * 0.002);
        asteroid.setVelocity(Phaser.Math.Between(-200, 200) * speedModifier, Phaser.Math.Between(50, 150));
        asteroid.allowGravity = false;

        // Dynamic scale sizing
        var randomScale = Phaser.Math.FloatBetween(0.015, 0.035);
        asteroid.setScale(randomScale);
    }
}

function hitAsteroid (player, asteroid) {
    this.physics.pause();
    player.setTint(0xff0000);
    player.anims.play('turn');

    this.add.text(450, 350, 'GAME OVER', { fontSize: '64px', fill: '#ff3333', fontStyle: 'bold' }).setOrigin(0.5);
    this.add.text(450, 420, 'Press SPACE to restart', { fontSize: '24px', fill: '#ffffff' }).setOrigin(0.5);

    gameOver = true;
}

</script>

</body>
</html>
