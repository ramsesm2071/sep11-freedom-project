<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Cyber Tower Defense</title>
    <script src="//cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.js"></script>
    <style type="text/css"> body { margin: 0; background-color: #000; overflow: hidden; user-select: none; } </style>
</head>
<body>
<script type="text/javascript">

var config = {
    type: Phaser.AUTO, width: 1000, height: 800,
    physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
    scene: { preload: preload, create: create, update: update }
};

var enemies, turrets, bullets, uiText, currentScene, spawnerEvent;
var money = 300, score = 0, selectedTowerType = "BASIC", enemySpawnDelay = 1100;
var pathWaypoints = [{x:-50,y:200},{x:300,y:200},{x:300,y:600},{x:750,y:600},{x:750,y:400},{x:500,y:400},{x:500,y:-50}];

var game = new Phaser.Game(config);
function preload () {}

function create () {
    currentScene = this;

    let tG = this.make.graphics({ x:0, y:0, add:false }); tG.fillStyle(0x00aaff, 1).fillRect(0, 0, 32, 32).fillStyle(0xffffff, 1).fillCircle(16, 16, 6); tG.generateTexture('turretAsset', 32, 32);
    let rpG = this.make.graphics({ x:0, y:0, add:false }); rpG.fillStyle(0xbb00ff, 1).fillRect(0, 0, 32, 32).fillStyle(0xffffff, 1).fillCircle(16, 16, 4); rpG.generateTexture('rapidTurretAsset', 32, 32);
    let snG = this.make.graphics({ x:0, y:0, add:false }); snG.fillStyle(0x00ff66, 1).fillRect(0, 0, 32, 32).fillStyle(0xffffff, 1).fillRect(14, 0, 4, 16); snG.generateTexture('sniperTurretAsset', 32, 32);

    let eG = this.make.graphics({ x:0, y:0, add:false }); eG.fillStyle(0xff3333, 1).fillCircle(12, 12, 12).fillStyle(0xffff33, 1).fillCircle(12, 12, 4); eG.generateTexture('enemyAsset', 24, 24);
    let tkG = this.make.graphics({ x:0, y:0, add:false }); tkG.fillStyle(0x8b5a2b, 1).fillRect(0, 0, 26, 26).fillStyle(0xff3333, 1).fillCircle(13, 13, 5); tkG.generateTexture('tankAsset', 26, 26);

    let bG = this.make.graphics({ x:0, y:0, add:false }); bG.fillStyle(0x00ffff, 1).fillCircle(4, 4, 4); bG.generateTexture('bulletAsset', 8, 8);
    let rbG = this.make.graphics({ x:0, y:0, add:false }); rbG.fillStyle(0xff55ff, 1).fillCircle(3, 3, 3); rbG.generateTexture('rapidBulletAsset', 6, 6);
    let sbG = this.make.graphics({ x:0, y:0, add:false }); sbG.fillStyle(0x00ff66, 1).fillRect(0, 0, 4, 12); sbG.generateTexture('sniperBulletAsset', 4, 12);

    var pathLines = this.add.graphics(); pathLines.lineStyle(40, 0x1a2233, 1).beginPath().moveTo(pathWaypoints.x, pathWaypoints.y);
    for (var i = 1; i < pathWaypoints.length; i++) { pathLines.lineTo(pathWaypoints[i].x, pathWaypoints[i].y); }
    pathLines.strokePath();

    enemies = this.physics.add.group(); turrets = this.add.group(); bullets = this.physics.add.group();
    uiText = this.add.text(20, 20, '', { fontSize: '20px', fill: '#00ffcc', fontStyle: 'bold' }); updateUI();

    this.input.keyboard.on('keydown-ONE', function () { selectedTowerType = "BASIC"; updateUI(); });
    this.input.keyboard.on('keydown-TWO', function () { selectedTowerType = "RAPID"; updateUI(); });
    this.input.keyboard.on('keydown-THREE', function () { selectedTowerType = "SNIPER"; updateUI(); });
    spawnerEvent = this.time.addEvent({ delay: enemySpawnDelay, callback: spawnInvader, callbackScope: this, loop: true });

    this.input.on('pointerdown', function (pointer) {
        var cost = (selectedTowerType === "BASIC") ? 100 : (selectedTowerType === "RAPID" ? 130 : 160);
        if (money >= cost) {
            var gX = Math.floor(pointer.x / 40) * 40 + 20; var gY = Math.floor(pointer.y / 40) * 40 + 20;
            var asset = (selectedTowerType === "BASIC") ? 'turretAsset' : (selectedTowerType === "RAPID" ? 'rapidTurretAsset' : 'sniperTurretAsset');

            // Check for Merge targets on click location
            var mergeTarget = null;
            turrets.children.iterate(function (existingTower) {
                if (existingTower && existingTower.x === gX && existingTower.y === gY && existingTower.texture.key === asset && existingTower.lv === 1) {
                    mergeTarget = existingTower;
                }
            });

            if (mergeTarget) {
                money -= cost;
                mergeTarget.lv = 2; mergeTarget.damage *= 2; mergeTarget.setTint(0xffcc00); // Level up! Double damage + Gold tint
                updateUI();
            } else {
                // Regular placement check to avoid stack bugs on different towers
                var spaceOccupied = false;
                turrets.children.iterate(function(e) { if(e && e.x === gX && e.y === gY) spaceOccupied = true; });

                if (!spaceOccupied) {
                    money -= cost;
                    var t = turrets.create(gX, gY, asset).setOrigin(0.5, 0.5); t.lv = 1;
                    if (selectedTowerType === "BASIC") { t.range = 175; t.fireRate = 800; t.bulletType = 'bulletAsset'; t.damage = 1.5; }
                    else if (selectedTowerType === "RAPID") { t.range = 140; t.fireRate = 220; t.bulletType = 'rapidBulletAsset'; t.damage = 0.5; }
                    else { t.range = 300; t.fireRate = 2000; t.bulletType = 'sniperBulletAsset'; t.damage = 6.0; }
                    t.nextFireTime = 0; updateUI();
                }
            }
        }
    });
    this.physics.add.overlap(bullets, enemies, hitEnemy, null, this);
}

function update (time) {
    enemies.children.iterate(function (enemy) {
        if (!enemy) return;
        var targetPoint = pathWaypoints[enemy.currentWaypointIndex];
        var distance = Phaser.Math.Distance.Between(enemy.x, enemy.y, targetPoint.x, targetPoint.y);
        if (distance < 6) {
            enemy.currentWaypointIndex++;
            if (enemy.currentWaypointIndex >= pathWaypoints.length) { enemy.destroy(); score = Math.max(0, score - 60); updateUI(); return; }
        }
        currentScene.physics.moveToObject(enemy, pathWaypoints[enemy.currentWaypointIndex], enemy.speedStat);
    });

    turrets.children.iterate(function (turret) {
        if (!turret) return;
        var closestEnemy = null, shortestDistance = turret.range;
        enemies.children.iterate(function (enemy) {
            if (!enemy) return;
            var dist = Phaser.Math.Distance.Between(turret.x, turret.y, enemy.x, enemy.y);
            if (dist < shortestDistance) { shortestDistance = dist; closestEnemy = enemy; }
        });
        if (closestEnemy && time > turret.nextFireTime) { fireTurretLaser(turret, closestEnemy); turret.nextFireTime = time + turret.fireRate; }
    });
}

function spawnInvader() {
    var roll = Phaser.Math.Between(1, 10);
    var asset = (roll > 7) ? 'tankAsset' : 'enemyAsset';
    var enemy = enemies.create(pathWaypoints.x, pathWaypoints.y, asset).setOrigin(0.5, 0.5);
    enemy.currentWaypointIndex = 1; enemy.hp = (roll > 7) ? 12.0 : 3.5; enemy.speedStat = (roll > 7) ? 50 : 95;
}

function fireTurretLaser(turret, target) {
    var b = bullets.create(turret.x, turret.y, turret.bulletType).setOrigin(0.5, 0.5);
    b.damageAmount = turret.damage; currentScene.physics.moveToObject(b, target, 550);
}

function hitEnemy(bullet, enemy) {
    var dmg = bullet.damageAmount || 1; bullet.destroy(); enemy.hp -= dmg;
    if (enemy.hp <= 0) { enemy.destroy(); money += 25; score += 100; updateUI(); }
}

function updateUI() {
    var bInd = (selectedTowerType === "BASIC") ? " >[SEL]" : "";
    var rInd = (selectedTowerType === "RAPID") ? " >[SEL]" : "";
    var sInd = (selectedTowerType === "SNIPER") ? " >[SEL]" : "";
    uiText.setText('Credits: $' + money + ' | Score: ' + score + '\n1: Cannon ($100)' + bInd + ' | 2: Rapid ($130)' + rInd + ' | 3: Sniper ($160)' + sInd + '\n[Click on an identical Level 1 tower to MERGE it up to Level 2!]');
}
</script>
</body>
</html>
